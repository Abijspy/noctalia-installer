name: Checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catch upstream compositor changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Shell and configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax and shellcheck
        run: |
          bash -n install.sh
          shellcheck -S warning install.sh tests/sim/run.sh tests/sim/stub tools/release.sh

      - name: Install Python checkers
        run: pip install lupa ckdl

      - name: Fetch Mango and Umbriel sources
        run: |
          git clone --depth 1 https://github.com/mangowm/mango.git /tmp/mango
          git clone --depth 1 https://github.com/noctalia-dev/umbriel.git /tmp/umbriel

      - name: Check every config
        run: python3 tests/check-configs.py --mango-src /tmp/mango --umbriel-src /tmp/umbriel

  simulate:
    name: Installer runs (stubbed distros)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run install.sh end to end against stubbed package managers
        run: sudo tests/sim/run.sh

  arch:
    name: Validate with the real tools (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install niri, Sway and Noctalia
        run: pacman -Syu --noconfirm --needed niri sway noctalia
      - name: niri validate
        run: niri validate -c configs/niri/config.kdl
      - name: sway -C
        # The packaged binary carries file capabilities a container can't
        # grant, so use a plain copy; sway -C still starts a backend, so
        # give it wlroots' headless one (no seat or GPU in a container).
        run: |
          install -m 755 "$(command -v sway)" /tmp/sway
          XDG_RUNTIME_DIR=/tmp WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 \
            /tmp/sway -C -c configs/sway/config
      - name: Validate configs as the installer writes them (keyboard options, displays, app theme)
        run: |
          pacman -S --noconfirm --needed python
          useradd -m tester
          python3 tests/sim/make-drm.py /tmp/drm
          NOCTALIA_OS_RELEASE=tests/sim/os/nixos NOCTALIA_TEST_DRM=/tmp/drm ./install.sh --yes --no-tui --user=tester \
            --compositors=niri,sway --layout=us,de --variant=intl, --switch-key=ctrl-shift --caps=escape --no-fonts
          niri validate -c /home/tester/.config/niri/config.kdl
          XDG_RUNTIME_DIR=/tmp WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 \
            /tmp/sway -C -c /home/tester/.config/sway/config

      - name: noctalia config validate
        # Noctalia may want a running session for some checks; don't fail the build on that.
        continue-on-error: true
        run: |
          mkdir -p /tmp/xdg/noctalia
          cp configs/noctalia/*.toml /home/tester/.config/noctalia/40-theme.toml /tmp/xdg/noctalia/
          XDG_CONFIG_HOME=/tmp/xdg noctalia config validate

  release:
    name: Tag matches VERSION
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag with install.sh and README
        run: |
          v="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' install.sh)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but install.sh says VERSION=$v"; exit 1; }
          grep -q "noctalia-installer/v$v/install.sh" README.md || { echo "README install command doesn't use v$v"; exit 1; }
